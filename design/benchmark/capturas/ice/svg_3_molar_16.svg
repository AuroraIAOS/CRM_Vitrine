<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 260" width="120" height="260"
     role="img" aria-label="Primeiro molar superior direito — dente 16" data-dente="16" data-tipo="molar">
  <title>Primeiro molar superior direito (FDI 16) — faces: mesial, distal, vestibular, lingual, oclusal</title>
  <style>
    .raiz  { fill: #e7e0d3;    stroke: #334155; stroke-width: 1.6; }
    .coroa { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; }
    .face  { fill: #e2e8f0; stroke: #334155; stroke-width: 1.2; }
    .raiz, .coroa, .face { cursor: pointer; }
    .rotulo { font: 600 11px system-ui, sans-serif; fill: #334155;
              text-anchor: middle; pointer-events: none; user-select: none; }
    .num    { font: 600 13px system-ui, sans-serif; fill: #334155;
              text-anchor: middle; pointer-events: none; }
    /* A marcação é um atributo de dado, não uma classe de estilo solta: quem lê
       o SVG salvo sabe o que está marcado sem interpretar cor. */
    [data-marcado="a_realizar"] { fill: #fde68a; }
    [data-marcado="executado"]  { fill: #86efac; }
    [data-marcado="existente"]  { fill: #93c5fd; }
  </style>
  <g id="dente-16">
