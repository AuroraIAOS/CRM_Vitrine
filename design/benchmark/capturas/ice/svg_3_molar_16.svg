    <path id="raiz-1" data-regiao="raiz" data-indice="1" class="raiz" d="M 39.7 118 C 43.7 76, 44.0 44, 53.4 24 C 50.0 44, 50.3 76, 54.3 118 Z" />
    <path id="raiz-2" data-regiao="raiz" data-indice="2" class="raiz" d="M 52.7 118 C 52.7 76, 57.0 44, 60.0 24 C 63.0 44, 67.3 76, 67.3 118 Z" />
    <path id="raiz-3" data-regiao="raiz" data-indice="3" class="raiz" d="M 65.7 118 C 61.7 76, 70.0 44, 66.6 24 C 76.0 44, 84.3 76, 80.3 118 Z" />
    </g>
    <g id="regiao-coroa">
    <path id="coroa" data-regiao="coroa" class="coroa" d="M 36 114 L 39 172 Q 60 184 81 172 L 84 114 Z" />
    </g>
    <text class="num" x="60" y="200">16</text>
    <g id="regiao-faces" transform="translate(0, 14)">
    <path id="face-distal" data-face="distal" class="face" d="M 41.62 234.38 A 26 26 0 0 1 41.62 197.62 L 52.28 208.28 A 10.92 10.92 0 0 0 52.28 223.72 Z" />
    <text class="rotulo" x="41.3" y="220.0">D</text>
    <path id="face-vestibular" data-face="vestibular" class="face" d="M 41.62 197.62 A 26 26 0 0 1 78.38 197.62 L 67.72 208.28 A 10.92 10.92 0 0 0 52.28 208.28 Z" />
    <text class="rotulo" x="60.0" y="201.3">V</text>
    <path id="face-mesial" data-face="mesial" class="face" d="M 78.38 197.62 A 26 26 0 0 1 78.38 234.38 L 67.72 223.72 A 10.92 10.92 0 0 0 67.72 208.28 Z" />
    <text class="rotulo" x="78.7" y="220.0">M</text>
    <path id="face-lingual" data-face="lingual" class="face" d="M 78.38 234.38 A 26 26 0 0 1 41.62 234.38 L 52.28 223.72 A 10.92 10.92 0 0 0 67.72 223.72 Z" />
    <text class="rotulo" x="60.0" y="238.7">L</text>
    <circle id="face-oclusal" data-face="oclusal" class="face" cx="60" cy="216" r="10.92" />
    </g>
  </g>
</svg>
